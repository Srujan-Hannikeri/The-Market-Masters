<section id="expenses-page" class="page">
  <div class="expenses-container">
    <div class="expenses-actions">
      <button id="add-expense-btn" class="btn btn-primary">
        <i class="fas fa-plus"></i> Add Expense
      </button>
    </div>

    <div class="card">
      <div class="card-header card-header-flex">
        <div class="tab-buttons">
          <button class="btn btn-sm btn-primary expense-period-tab" data-period="today"><i class="fas fa-calendar-day"></i> Today's Expenses</button>
          <button class="btn btn-sm btn-secondary expense-period-tab" data-period="month"><i class="fas fa-calendar-alt"></i> This Month's Expenses</button>
          <button class="btn btn-sm btn-secondary expense-period-tab" data-period="year"><i class="fas fa-calendar"></i> This Year's Expenses</button>
        </div>
      </div>
      <div class="card-body">
        <table class="table">
          <thead>
            <tr>
              <th>Type</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="expenses-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>
