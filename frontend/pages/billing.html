<section id="billing-page" class="page">
  <div class="billing-container">
    <div class="billing-form-section">
      <div class="card">
        <div class="card-header">
          <h3>Create New Bill</h3>
        </div>
        <div class="card-body">
          <form id="create-bill-form" onsubmit="event.preventDefault(); billing.createBill();">
            <div class="form-row">
              <div class="form-group">
                <label>Customer Name</label>
                <input type="text" id="bill-customer-name" placeholder="Walk-in Customer">
              </div>
              <div class="form-group">
                <label>Customer Phone</label>
                <input type="tel" id="bill-customer-phone" placeholder="N/A">
              </div>
            </div>

            <div class="bill-items-section">
              <h4>Items</h4>
              <div id="bill-items-container">
                <!-- Dynamic items -->
              </div>
              <button type="button" id="add-item-btn" class="btn btn-secondary">
                <i class="fas fa-plus"></i> Add Item
              </button>
            </div>

            <div class="bill-summary">
              <div class="summary-row">
                <span>Subtotal:</span>
                <span id="bill-subtotal">₹0</span>
              </div>
              <div class="summary-row total">
                <span>Total:</span>
                <span id="bill-total">₹0</span>
              </div>
            </div>

            <div class="payment-section">
              <h4>Payment</h4>
              <div class="form-row">
                <div class="form-group">
                  <label>Payment Mode</label>
                  <select id="payment-mode">
                    <option value="Cash">Cash</option>
                    <option value="UPI">UPI</option>
                    <option value="Card">Card</option>
                    <option value="Net Banking">Net Banking</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Paid Amount</label>
                  <input type="number" id="paid-amount" value="0" min="0">
                </div>
              </div>
              <div class="payment-status-display">
                Status: <span id="payment-status">Pending</span>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Create Bill
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="bills-list-section">
      <div class="card">
        <div class="card-header recent-bills-header">
          <h3 style="white-space: nowrap; margin: 0;">Recent Bills</h3>
          <div class="filter-group">
            <!-- Print format selector — used by the Print button on each bill card -->
            <select id="print-format-select" title="Select print paper size" style="min-width:130px;">
              <option value="a4">A4 (Standard)</option>
              <option value="a3">A3 (Large)</option>
              <option value="a5">A5 (Half page)</option>
              <option value="letter">Letter (US)</option>
              <option value="80mm">80 mm Roll (Thermal)</option>
              <option value="58mm">58 mm Roll (Thermal)</option>
            </select>
            <select id="bill-status-filter">
              <option value="">All Status</option>
              <option value="Paid">Paid</option>
              <option value="Pending">Pending</option>
              <option value="Partially Paid">Partially Paid</option>
            </select>
          </div>
        </div>
        <div class="card-body">
          <!-- Search Bar -->
          <div class="search-bar">
            <input type="text" id="bill-search" placeholder="Search by customer name or phone..." class="search-input">
          </div>
          <div id="bills-list" class="bills-list">
            <!-- Dynamic content -->
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
