<section id="reports-page" class="page">
  <div class="reports-container">
    <div class="report-filters">
      <div class="form-row">
        <div class="form-group">
          <label>From Date</label>
          <input type="date" id="report-start-date">
        </div>
        <div class="form-group">
          <label>To Date</label>
          <input type="date" id="report-end-date">
        </div>
        <div class="form-group">
          <button id="generate-report-btn" class="btn btn-primary"><i class="fas fa-sync"></i> Generate</button>
        </div>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header"><h3>Sales Trend</h3></div>
        <div class="card-body"><canvas id="sales-trend-chart" style="height:260px;"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Payment Mode Distribution</h3></div>
        <div class="card-body"><canvas id="payment-mode-chart" style="height:260px;"></canvas></div>
      </div>
    </div>

    <!-- Profit / Loss Summary -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-chart-pie"></i> Profit / Loss Summary</h3>
      </div>
      <div class="card-body">
        <div id="profit-loss-summary" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;">
          <!-- Filled by reports.js -->
        </div>
      </div>
    </div>

    <!-- Customer Breakdown -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-users"></i> Customer Breakdown</h3>
      </div>
      <div class="card-body" id="customer-breakdown-container">
        <!-- Filled by reports.js -->
      </div>
    </div>

  </div>
</section>
