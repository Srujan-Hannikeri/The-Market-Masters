<section id="payments-page" class="page">
  <div class="payments-container">

    <!-- Payment Summary -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-chart-bar"></i> Payment Summary</h3>
      </div>
      <div class="card-body">
        <div class="payment-modes-grid" id="payment-modes-summary">
          <!-- Filled by payments.js renderPaymentSummary -->
        </div>
      </div>
    </div>

    <!-- Pending Dues -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-clock"></i> Pending Dues</h3>
        <span class="badge badge-warning" id="pending-count">0</span>
      </div>
      <div class="card-body">
        <div style="overflow-x:auto;">
          <table class="table">
            <thead>
              <tr>
                <th>Bill #</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Due</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="pending-dues-table"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- All Bills -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-file-invoice"></i> All Bills</h3>
      </div>
      <div class="card-body">
        <div style="overflow-x:auto;">
          <table class="table">
            <thead>
              <tr>
                <th>Bill #</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Balance</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="all-bills-table"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Recent Payments -->
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-credit-card"></i> Recent Payments</h3>
      </div>
      <div class="card-body">
        <div style="overflow-x:auto;">
          <table class="table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Bill #</th>
                <th>Customer</th>
                <th>Mode</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody id="all-payments-table"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</section>
