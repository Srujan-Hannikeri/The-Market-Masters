<section id="profile-page" class="page">
  <div class="profile-container">
    <div class="card">
      <div class="card-header">
        <h3>Shopkeeper Profile</h3>
        <button id="edit-profile-btn" class="btn btn-primary"><i class="fas fa-edit"></i> Edit Profile</button>
      </div>
      <div class="card-body">
        <div id="profile-view">
          <div class="profile-section">
            <h4>Personal Information</h4>
            <div class="profile-field"><label>Full Name:</label><span id="profile-name">-</span></div>
            <div class="profile-field"><label>Phone Number:</label><span id="profile-phone">-</span></div>
            <div class="profile-field"><label>Email:</label><span id="profile-email">-</span></div>
            <div class="profile-field"><label>Role:</label><span id="profile-role">-</span></div>
          </div>
          <div class="profile-section">
            <h4>Shop Information</h4>
            <div class="profile-field"><label>Shop Name:</label><span id="profile-shop-name">-</span></div>
            <div class="profile-field"><label>Shop Address:</label><span id="profile-shop-address">-</span></div>
            <div class="profile-field"><label>UPI ID:</label><span id="profile-upi-id">-</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
